name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fightiq_test
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: fightiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRAINING_TEST_POSTGRES_URL: postgresql://fightiq_test:ci-test-only-password@localhost:5432/fightiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check static/app.js && node --check static/video.js && node --check static/training.js && node --check static/live.js
      - run: npm install --prefix .test-deps --no-audit --no-fund jsdom@30.1.3
      - run: node tests/training_ui.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/.test-deps/node_modules
      - run: node tests/live_ui.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/.test-deps/node_modules
