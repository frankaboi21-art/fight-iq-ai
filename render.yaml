services:
  - type: web
    name: fight-iq-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_API_KEY
        sync: false
      - key: BETA_ACCESS_CODE
        sync: false
      - key: COACH_HOURLY_LIMIT
        value: "10"
      - key: COACH_DAILY_LIMIT
        value: "30"
