<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fight IQ AI</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui;background:#090b10;color:#f5f7fb}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#191e2c,#090b10 42%)}
.wrap{max-width:1120px;margin:auto;padding:38px 20px 70px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}
.brand{font-weight:900;letter-spacing:.08em}.badge{padding:7px 11px;border:1px solid #30384d;border-radius:999px;color:#a9b4cb;font-size:12px}
h1{font-size:clamp(38px,7vw,76px);line-height:.95;margin:15px 0;max-width:820px}
.sub{color:#a9b4cb;max-width:720px;font-size:18px;line-height:1.6}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:30px}.card{background:#111620d9;border:1px solid #252d3e;border-radius:18px;padding:20px;box-shadow:0 20px 60px #0005}
h2{margin:0 0 14px;font-size:18px}.mistake{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid #232a39}
.mistake:last-child{border:0}.muted{color:#8e9ab3;font-size:13px}.controls{display:flex;gap:8px;align-items:center}
select,textarea,button{border-radius:10px;border:1px solid #30384c;background:#0c111a;color:#fff;padding:10px}
button{cursor:pointer;font-weight:800;background:#f5f7fb;color:#090b10;border:0}button.secondary{background:#202839;color:#fff}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.score{font-size:70px;font-weight:900;line-height:1}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.pillar{background:#0b1018;border-radius:12px;padding:12px}
.bar{height:6px;background:#252d3e;border-radius:999px;overflow:hidden;margin-top:8px}.bar>span{display:block;height:100%;background:#f5f7fb}
#coach{white-space:pre-wrap;line-height:1.55;color:#d6dbea}.status{font-size:12px;color:#94a0b8}
textarea{width:100%;min-height:88px;margin-top:12px;resize:vertical}
@media(max-width:820px){.grid{grid-template-columns:1fr}.pillars{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">FIGHT IQ AI</div><div class="badge" id="health">Checking API…</div></header>
<h1>Decision-making, scored like a fight.</h1>
<p class="sub">Log tactical mistakes, get a six-pillar Fight IQ score, then turn the result into focused AI corner advice.</p>
<div class="grid">
<section class="card"><h2>Fight Log</h2><div id="mistakes"></div><div class="actions"><button id="analyze">Analyze Fight IQ</button><button class="secondary" id="demo">Load Demo</button></div></section>
<section class="card">
<h2>Fight IQ Score</h2><div class="score" id="score">100</div><div class="muted" id="grade">Grade A</div><div class="pillars" id="pillars"></div>
<h2 style="margin-top:22px">Priority Fix</h2><div id="priority" class="muted">No mistakes logged yet.</div>
<textarea id="context" placeholder="Optional context: stance, opponent style, round, goal…"></textarea>
<div class="actions"><button id="coachBtn">Ask AI Corner</button></div><p class="status" id="coachStatus"></p><div id="coach"></div>
</section>
</div>
</div>
<script>
const selected = new Map();
const fmt=s=>s.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
async function loadHealth(){try{const r=await fetch('/api/v1/health');const d=await r.json();health.textContent=d.openai_configured?'API + AI ready':'API ready • AI key needed'}catch{health.textContent='API offline'}}
async function loadMistakes(){const r=await fetch('/api/v1/mistakes');const d=await r.json();mistakes.innerHTML=d.mistakes.map(m=>`<div class="mistake"><div><b>${m.name}</b><div class="muted">${fmt(m.pillar)} • danger ${m.danger_rating}/5</div></div><div class="controls"><input type="checkbox" data-id="${m.id}"><select data-sev="${m.id}"><option>minor</option><option selected>risky</option><option>critical</option></select></div></div>`).join('')}
async function analyze(forceDemo=false){let payload;if(forceDemo){const r=await fetch('/api/v1/analysis/demo');render(await r.json());return}payload=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>({mistake_id:x.dataset.id,severity:document.querySelector(`[data-sev="${x.dataset.id}"]`).value,round:1}));const r=await fetch('/api/v1/analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mistakes:payload})});render(await r.json())}
let current=null;function render(d){current=d;score.textContent=d.overall_score;grade.textContent='Grade '+d.grade;pillars.innerHTML=Object.entries(d.pillar_scores).map(([k,v])=>`<div class="pillar"><b>${fmt(k)}</b><div class="muted">${v.score}</div><div class="bar"><span style="width:${v.score}%"></span></div></div>`).join('');priority.innerHTML=d.priority_fix?`<b>${d.priority_fix.name}</b><br>${d.priority_fix.coaching_cue}<br><span class="muted">Drills: ${d.priority_fix.drills.join(' • ')}</span>`:'No mistakes logged yet.'}
async function coachAI(){if(!current)await analyze();coachStatus.textContent='Generating corner advice…';coach.textContent='';const r=await fetch('/api/v1/ai/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({analysis:current,context:context.value})});const d=await r.json();if(!r.ok){coachStatus.textContent=d.detail||'AI request failed';return}coachStatus.textContent='';coach.textContent=d.advice}
document.getElementById('analyze').onclick=()=>analyze();document.getElementById('demo').onclick=()=>analyze(true);document.getElementById('coachBtn').onclick=coachAI;loadHealth();loadMistakes();analyze();
</script>
</body>
</html>
